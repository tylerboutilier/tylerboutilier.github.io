<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tyler Boutilier</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;

      font-family: 'Source Serif 4', serif;
      font-size: 18px;
      line-height: 1.7;
      color: #222;
      background-color: #fafafa;
    }

    h1, h2, nav {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 20px;
      margin-top: 40px;
      margin-bottom: 10px;
    }

    p {
      margin: 10px 0;
    }

    .subtle {
      color: #666;
    }

    /* 🔥 Updated nav */
    nav {
      margin-top: 30px;
      margin-bottom: 30px;
      font-size: 17px; /* bigger */
    }

    nav a {
      margin-right: 20px;
      text-decoration: none;
      color: #333;
      position: relative;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Optional: subtle divider for structure */
    .divider {
      height: 1px;
      background: #e5e5e5;
      margin: 30px 0;
    }

  </style>
</head>

<body>

  <h1>Hi, I’m Tyler 👋</h1>
  <p class="subtle">Urban planner based in Nova Scotia.</p>

  <p>
    This is a simple collection of my life, travels, thoughts, and projects.
  </p>

  <nav>
    <a href="#">About</a>
    <a href="#">Travel</a>
    <a href="#">Projects</a>
  </nav>

  <div class="divider"></div>

  <h2>Latest</h2>
  <p class="subtle">Coming soon.</p>

</body>
</html>
